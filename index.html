<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Курьер</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="menu-screen" class="screen">
    <h1>Курьер</h1>
    <p class="subtitle">Развози заказы, копи на технику, расширяй дело</p>
    <div class="menu-buttons">
      <button id="btn-new-game">Новая игра</button>
      <button id="btn-continue">Продолжить</button>
      <button id="btn-import">Загрузить файл сохранения</button>
    </div>
    <input type="file" id="import-file" accept="application/json" hidden>
    <p id="menu-hint" class="hint"></p>
  </section>

  <section id="game-screen" class="screen hidden">
    <header id="topbar">
      <div class="topbar-row">
        <span id="hud-money">0 ₽</span>
        <span id="hud-time">День 1, 08:00</span>
        <div class="topbar-icons">
          <button id="btn-map-toggle" class="icon-btn map-toggle-btn">🗺 Карта страны</button>
          <button id="btn-diary" class="icon-btn">📔</button>
          <button id="btn-open-menu" class="icon-btn">☰</button>
        </div>
      </div>
      <div class="bars">
        <div class="bar-row">
          <span class="bar-label">Усталость</span>
          <div class="bar"><div id="bar-fatigue" class="bar-fill fatigue"></div></div>
        </div>
        <div class="bar-row">
          <span class="bar-label">Голод</span>
          <div class="bar"><div id="bar-hunger" class="bar-fill hunger"></div></div>
        </div>
        <div class="bar-row">
          <span class="bar-label">Техника</span>
          <div class="bar"><div id="bar-condition" class="bar-fill condition"></div></div>
        </div>
      </div>
    </header>

    <div id="toast-area"></div>

    <canvas id="map-canvas"></canvas>

    <div id="point-panel" class="panel hidden"></div>

    <div id="actions-notify" class="notify-list"></div>

    <div id="current-job-panel" class="panel hidden"></div>

    <div id="status-panel" class="panel"></div>

    <div id="job-list-wrap">
      <h3>Доступные заказы</h3>
      <ul id="job-list" class="job-list"></ul>
    </div>
  </section>

  <div id="offline-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Пока тебя не было</h2>
      <p id="offline-header"></p>
      <ul id="offline-list" class="diary-list"></ul>
      <button id="btn-offline-ok">Понятно</button>
    </div>
  </div>

  <div id="diary-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Дневник</h2>
      <ul id="diary-list-full" class="diary-list"></ul>
      <button id="btn-diary-close">Закрыть</button>
    </div>
  </div>

  <div id="problem-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="problem-title"></h2>
      <p id="problem-text"></p>
      <div id="problem-actions" class="problem-actions"></div>
    </div>
  </div>

  <div id="shop-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Магазин техники</h2>
      <ul id="shop-list" class="shop-list"></ul>
      <button id="btn-shop-close">Закрыть</button>
    </div>
  </div>

  <div id="menu-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Меню</h2>
      <button id="btn-save">Сохранить</button>
      <button id="btn-export">Скачать сохранение</button>
      <button id="btn-menu">Выйти в главное меню</button>
      <button id="btn-menu-close">Закрыть</button>
    </div>
  </div>

  <div id="workshop-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Мастерская</h2>
      <p id="workshop-condition"></p>
      <div class="workshop-actions">
        <button id="btn-workshop-repair">Полный ремонт — 20 ₽</button>
        <button id="btn-workshop-upgrade">Укрепить подвеску — 150 ₽</button>
      </div>
      <p class="hint" id="workshop-upgrade-hint"></p>
      <button id="btn-workshop-close">Закрыть</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
